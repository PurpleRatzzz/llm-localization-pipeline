# Runs the unit tests on every push and pull request. No API key is needed:
# the tests cover the deterministic parts (QA gate, XLIFF, context, TM,
# evaluation) and never call the LLM.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
